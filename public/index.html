<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWS ChatBot - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-wrapper">
        <!-- Header Chat -->
        <header class="chat-header">
            <div class="chat-header-info">
                <div class="avatar-container">
                    <div class="bot-avatar header-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="10" rx="3"></rect>
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                            <line x1="8" y1="16" x2="8.01" y2="16"></line>
                            <line x1="16" y1="16" x2="16.01" y2="16"></line>
                        </svg>
                    </div>
                    <span class="status-indicator"></span>
                </div>
                <div class="header-text">
                    <h1 class="bot-title">PWS ChatBot AI</h1>
                    <p class="bot-status">Online • Powered by OpenRouter</p>
                </div>
            </div>
            <div class="chat-header-actions">
                <button type="button" id="clearBtn" class="icon-button" title="Bersihkan Percakapan" aria-label="Bersihkan Percakapan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Area Pesan Chat -->
        <main class="chat-messages" id="chatMessages">
            <!-- Welcome Greeting Screen -->
            <div class="welcome-card" id="welcomeCard">
                <div class="welcome-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h2>Selamat Datang di PWS ChatBot!</h2>
                <p>Halo! Saya adalah asisten AI Anda. Tanyakan apa saja seputar pemrograman, web service, atau topik menarik lainnya.</p>
                
                <div class="suggestions-container">
                    <p class="suggestions-label">Coba tanyakan sesuatu:</p>
                    <div class="suggestions-grid">
                        <button class="suggestion-chip" data-prompt="Apa itu REST API dan bagaimana cara kerjanya?">
                            💡 Apa itu REST API?
                        </button>
                        <button class="suggestion-chip" data-prompt="Jelaskan cara kerja routing di Express.js beserta contohnya.">
                            ⚡ Routing di Express.js
                        </button>
                        <button class="suggestion-chip" data-prompt="Buatkan contoh kode HTML, CSS, dan JavaScript untuk tombol interaktif.">
                            🎨 Contoh HTML, CSS, & JS
                        </button>
                        <button class="suggestion-chip" data-prompt="Apa perbedaan synchronous dan asynchronous di JavaScript?">
                            ⏳ Sync vs Async JavaScript
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Form Input Chat -->
        <footer class="chat-footer">
            <form id="chatForm" class="chat-input-container">
                <textarea 
                    id="userInput" 
                    placeholder="Ketik pesan Anda di sini... (Shift + Enter untuk baris baru)" 
                    rows="1" 
                    maxlength="2000"
                    autocomplete="off"
                    required
                ></textarea>
                <button type="submit" id="sendBtn" class="send-button" title="Kirim Pesan" aria-label="Kirim Pesan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="chat-disclaimer">
                <span>Tekan <strong>Enter</strong> untuk mengirim, <strong>Shift + Enter</strong> untuk baris baru.</span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
